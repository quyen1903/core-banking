
spring:
  application:
    name: core

  config:
    import: "optional:file:./.env[.properties]"

  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  datasource:
    url: ${CONNECTION_STRING}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true

  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true

  profiles:
    active: local

server:
  port: 8080

---

# Temporary development access is restricted to the isolated local profile.
spring:
  config:
    activate:
      on-profile: "local & !dev & !test & !qa & !uat & !staging & !pre-prod & !prod"

server:
  address: 127.0.0.1
